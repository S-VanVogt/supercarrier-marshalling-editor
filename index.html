<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperCarrier Marshalling Editor</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="card">
  <h1>SuperCarrier Marshalling Editor</h1>
  <canvas id="c" height="500"></canvas>

  <div class="controls">
    <span>Progress:</span>
    <input type="range" min="0" max="100" value="50" id="tslider" style="flex:1;min-width:120px">
    <span id="tval" style="min-width:32px">0.50</span>
    <span class="coord-out" id="coordout">x: &mdash;, y: &mdash;</span>
  </div>

  <p class="hint">Click to add points. Drag to move them. Scroll to zoom. Shift-drag or middle-drag to pan.</p>

  <!-- Point list -->
  <div id="pt-list">
    <div id="pt-list-title" class="pt-list-title">Polyline Points</div>
    <div class="pt-header"><span>#</span><span>x</span><span>y</span><span></span></div>
    <div id="pt-rows"></div>
    <div class="add-row">
      <label>Add:</label>
      <input type="number" id="add-x" placeholder="x" step="0.1">
      <input type="number" id="add-y" placeholder="y" step="0.1">
      <button id="btn-add">+ Add point</button>
    </div>
  </div>

  <!-- Takeoff Routes -->
  <details class="panel" id="panel-takeoff" open>
    <summary>Takeoff Routes</summary>
    <div class="panel-body route-panel">
      <div class="route-global">
        <label class="toggle-label">
          <input type="checkbox" id="takeoff-global" checked>
          Show all takeoff routes
        </label>
      </div>
      <div class="route-list" id="takeoff-route-list"></div>
    </div>
  </details>

  <!-- Landing Routes (placeholder) -->
  <details class="panel" id="panel-landing">
    <summary>Landing Routes</summary>
    <div class="panel-body route-panel">
      <div class="route-global">
        <label class="toggle-label">
          <input type="checkbox" id="landing-global">
          Show all landing routes
        </label>
      </div>
      <div class="route-list" id="landing-route-list"></div>
      <p class="hint" style="margin:4px 0 0">No landing route data loaded yet.</p>
    </div>
  </details>

  <!-- Lua Import / Export -->
  <details class="panel" id="panel-lua-io" open>
    <summary>RunwaysAndRoutes Import / Export</summary>
    <div class="panel-body">
      <div class="btn-row">
        <button id="btn-import-lua">Import RunwaysAndRoutes</button>
        <button id="btn-export-lua">Export Lua</button>
        <input type="text" id="lua-header-comment" placeholder="Header comment for exported Lua" style="flex:1;min-width:160px;font-size:12px;padding:4px 8px;border:0.5px solid #b4b2a9;border-radius:8px;outline:none">
      </div>
    </div>
  </details>

  <!-- Crew -->
  <details class="panel" id="panel-crew">
    <summary>Crew</summary>
    <div class="panel-body route-panel">
      <div class="route-global">
        <label class="toggle-label">
          <input type="checkbox" id="crew-global" checked>
          Show all crew members
        </label>
      </div>
      <div class="route-list" id="crew-list"></div>
    </div>
  </details>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
